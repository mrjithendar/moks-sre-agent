# How MOKS reaches the shared moks-rag service (docs/SHARED_KNOWLEDGE.md, values sharedKnowledge). The token is
# rag-api's RAG_BEARER_TOKEN, held in Secret rag-secrets in namespace rag; a Secret cannot be read across namespaces,
# so it is copied here. Without this Secret MOKS starts and triages on live evidence alone.
#   kubectl -n moks-sre create secret generic moks-rag-client \
#     --from-literal=RAG_API_URL=http://rag-api.rag.svc.cluster.local:8000 \
#     --from-literal=RAG_BEARER_TOKEN="$(kubectl -n rag get secret rag-secrets -o jsonpath='{.data.RAG_BEARER_TOKEN}' | base64 -d)"
apiVersion: v1
kind: Secret
metadata:
  name: moks-rag-client
  namespace: moks-sre
type: Opaque
stringData:
  RAG_API_URL: http://rag-api.rag.svc.cluster.local:8000
  RAG_BEARER_TOKEN: replace-me
