# How MOKS reaches the shared moks-rag service (docs/SHARED_KNOWLEDGE.md, values sharedKnowledge). The token is MOKS's
# own (rag-api 0.2.0+: moks-rag `scripts/issue-service-token.sh moks-sre-agent` writes RAG_BEARER_TOKEN here and lets it
# read and write sre_knowledge only). Before that, rag-api's shared RAG_BEARER_TOKEN from Secret rag/rag-secrets can be
# copied here instead. Without this Secret MOKS starts and triages on live evidence alone.
apiVersion: v1
kind: Secret
metadata:
  name: moks-rag-client
  namespace: moks-sre
type: Opaque
stringData:
  RAG_API_URL: http://rag-api.rag.svc.cluster.local:8000
  RAG_BEARER_TOKEN: replace-me
